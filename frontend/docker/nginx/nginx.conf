# SGDI Frontend - NGINX Configuration
# Optimizado para servir archivos estáticos y proxy a API backend

upstream api_backend {
    server api:8000;
    keepalive 32;
}

# Cache para archivos estáticos
proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=100m inactive=60m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name _;
    
    # Root directory para archivos estáticos
    root /usr/share/nginx/html;
    index index.html login.html;
    
    # Charset
    charset utf-8;
    
    # Logging
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;
    
    # Client upload limits (para subir archivos grandes)
    client_max_body_size 200M;
    client_body_buffer_size 128k;
    client_body_timeout 300s;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # Content Security Policy
    # Permite scripts/estilos propios y data: para inline SVG
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://api:8000; frame-ancestors 'self';" always;
    
    # Permissions Policy (antes Feature-Policy)
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # ==========================================
    # API Proxy a Backend
    # ==========================================
    location /api {
        # Añadir barra final si no existe
        rewrite ^/api$ /api/ permanent;
    }
    
    location /api/ {
        # Rewrite /api/xxx a /xxx en el backend
        rewrite ^/api/(.*)$ /$1 break;
        
        proxy_pass http://api_backend/;
        proxy_http_version 1.1;
        
        # Headers para proxy
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Keepalive
        proxy_set_header Connection "";
        
        # Timeouts para uploads grandes
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        send_timeout 300s;
        
        # Buffering (desactivar para streaming de backups)
        proxy_buffering off;
        proxy_request_buffering off;
        
        # CORS ya se maneja en backend FastAPI, pero podemos agregar fallback
        # add_header Access-Control-Allow-Origin $http_origin always;
        # add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
        # add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-Id" always;
        # add_header Access-Control-Allow-Credentials "true" always;
        
        # Preflight OPTIONS
        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Request-Id" always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Max-Age 1728000;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
    }
    
    # ==========================================
    # Archivos Estáticos
    # ==========================================
    
    # HTML files - sin cache (siempre frescos)
    location ~* \.(html)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    
    # CSS files - SIN CACHE para desarrollo
    location ~* \.(css)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        
        # Compression
        gzip on;
        gzip_types text/css;
        gzip_vary on;
    }
    
    # JavaScript files - SIN CACHE para desarrollo
    location ~* \.(js|mjs)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        
        # Compression
        gzip on;
        gzip_types application/javascript text/javascript;
        gzip_vary on;
    }
    
    # Assets (images, fonts, icons) - cache largo (30 días)
    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot|otf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        
        # Compression para SVG
        gzip on;
        gzip_types image/svg+xml;
        gzip_vary on;
        
        # Access log no necesario para assets
        access_log off;
    }
    
    # Documentación - sin cache
    location ~* \.(md|txt)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Content-Type "text/plain; charset=utf-8";
    }
    
    # ==========================================
    # Rutas Especiales
    # ==========================================
    
    # Health check endpoint (para Kubernetes/Docker health checks)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
    
    # Fallback para SPA routing (todas las rutas no encontradas → index.html)
    # Excepto archivos que claramente no existen
    location / {
        try_files $uri $uri/ /index.html;
        
        # Security headers
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }
    
    # Negar acceso a archivos ocultos (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # Negar acceso a archivos de configuración
    location ~ /\.(?:htaccess|htpasswd|gitignore|env) {
        deny all;
    }
    
    # Negar acceso a archivos de backup
    location ~ ~$ {
        deny all;
        access_log off;
        log_not_found off;
    }
    
    # ==========================================
    # Optimizaciones
    # ==========================================
    
    # Gzip compression (global)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/rss+xml
        application/atom+xml
        image/svg+xml
        application/x-font-ttf
        application/x-font-opentype
        application/vnd.ms-fontobject;
    
    # Open file cache
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # Keepalive
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # Buffers
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    
    # Logs optimización
    log_not_found off;
}
