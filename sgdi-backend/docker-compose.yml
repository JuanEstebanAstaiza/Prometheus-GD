version: '3.8'

services:
  db:
    image: postgres:15
    container_name: sgdi-postgres
    environment:
      POSTGRES_DB: sgdi_db
      POSTGRES_USER: sgdi_user
      POSTGRES_PASSWORD: sgdi_password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgdi_user -d sgdi_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sgdi-network

  api:
    build: .
    container_name: sgdi-api
    environment:
      - DATABASE_URL=postgresql://sgdi_user:sgdi_password@db:5432/sgdi_db
      - DB_SCHEMA=sgdi
      - JWT_SECRET_KEY=your-super-secret-jwt-key-here-change-in-production
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - STORAGE_PATH=/app/storage
      - BACKUP_PATH=/app/backups
      - MAX_UPLOAD_SIZE_MB=50
      - ALLOWED_MIME_TYPES=application/pdf,text/csv,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel
      - SYSTEM_USER_ID=00000000-0000-0000-0000-000000000000
      - SCHEDULER_ENABLED=true
      - SCHEDULER_CRON=0 0 1 * *
      - LOG_LEVEL=INFO
      - SUPERADMIN_EMAIL=admin@sgdi.com
      - SUPERADMIN_PASSWORD=Admin123!
      - SUPERADMIN_FULL_NAME=Super Administrador
    ports:
      - "8000:8000"
    volumes:
      - storage:/app/storage
      - backups:/app/backups
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 10 &&
        echo 'Running database initialization...' &&
        python scripts/apply_migrations.py --apply --dry-run-first=false &&
        echo 'Creating superadmin user...' &&
        python scripts/seed_superadmin.py &&
        echo 'Starting application...' &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    networks:
      - sgdi-network

  frontend:
    build:
      context: ../frontend
      dockerfile: docker/nginx/Dockerfile
    container_name: sgdi-frontend
    ports:
      - "3000:80"
    volumes:
      # Para desarrollo (hot-reload sin rebuild)
      - ../frontend:/usr/share/nginx/html:ro
    networks:
      - sgdi-network
    depends_on:
      - api
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sgdi-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sgdi.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "8080:80"
    depends_on:
      - db
    networks:
      - sgdi-network
    profiles:
      - pgadmin

volumes:
  db_data:
    driver: local
  storage:
    driver: local
  backups:
    driver: local

networks:
  sgdi-network:
    driver: bridge
